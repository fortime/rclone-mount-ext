[package]
name = "rclone-mount-ext"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
cvt = "0.1.2"
futures-util = "0.3.31"
libc = "0.2.177"
secret-service = { version = "5.1.0", features = ["rt-tokio-crypto-openssl"] }
tokio = { version = "1.48.0", features = ["macros", "process", "rt", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
zbus = { version = "5.12.0", default-features = false, features = ["tokio"] }
