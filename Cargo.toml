[package]
name = "rclone-mount-ext"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread", "signal", "time"] }
zbus = { version = "5.12.0", default-features = false, features = ["tokio"] }
